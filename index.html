<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos da Rebeca</title>
<meta name="description" content="Os melhores achadinhos da Shopee, Amazon e Mercado Livre, garimpados pela Rebeca Sancho.">
<meta property="og:title" content="Achadinhos da Rebeca">
<meta property="og:description" content="Os melhores achadinhos da Shopee, Amazon e Mercado Livre.">
<meta property="og:url" content="https://www.achadinhosdarebeca.com.br/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#e8566c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f3;--bg2:#ffe3d6;--ink:#3a2229;--muted:#8a6670;--brand:#e8566c;--card:#ffffff;--line:#f3d2d8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);min-height:100vh;
 background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;justify-content:center;padding:40px 16px 32px}
main{width:100%;max-width:440px;text-align:center}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
 background:linear-gradient(135deg,#f58aa0,#e8566c);color:#fff;font-size:40px;font-weight:700;
 box-shadow:0 8px 24px rgba(232,86,108,.35);border:4px solid #fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.5rem;font-weight:700}
.sub{color:var(--muted);font-size:.95rem;margin:6px 0 26px;line-height:1.45}
.links{display:flex;flex-direction:column;gap:12px}
a.btn,span.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;background:var(--card);
 border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:1rem;
 box-shadow:0 2px 10px rgba(58,34,41,.06);transition:transform .15s,box-shadow .15s}
a.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(232,86,108,.18)}
a.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
span.btn{opacity:.55;cursor:default}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none;background:#fff5f6}
a.btn.primary .ico{background:rgba(255,255,255,.2)}
.lbl{flex:1;text-align:left}
.tag{font-size:.72rem;font-weight:600;color:var(--muted)}
footer{margin-top:30px;font-size:.75rem;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main>
  <div class="avatar" id="avatar">R</div>
  <h1>Achadinhos da Rebeca</h1>
  <p class="sub">Os melhores achadinhos da Shopee, Amazon e Mercado Livre,<br>testados e garimpados pra você 💖</p>
  <nav class="links" id="links"></nav>
  <footer>Como afiliada, posso receber comissão por compras feitas pelos links — sem custo extra pra você.<br>© <span id="y"></span> Achadinhos da Rebeca</footer>
</main>
<script>
// ===== EDITE OS LINKS AQUI (vazio = "em breve") =====
const FOTO = ""; // URL da foto de perfil (opcional)
const LINKS = [
  {ico:"💬", label:"Grupo VIP de Achadinhos no WhatsApp", url:"", primary:true},
  {ico:"📸", label:"Instagram", url:""},
  {ico:"🧡", label:"Achadinhos Shopee", url:""},
  {ico:"📦", label:"Achadinhos Amazon", url:""},
  {ico:"💛", label:"Achadinhos Mercado Livre", url:""},
  {ico:"🎵", label:"TikTok", url:""},
];
// ====================================================
const nav=document.getElementById('links');
LINKS.forEach(l=>{
  const el=document.createElement(l.url?'a':'span');
  el.className='btn'+(l.primary&&l.url?' primary':'');
  if(l.url){el.href=l.url;el.target='_blank';el.rel='noopener'}
  el.innerHTML=`<span class="ico">${l.ico}</span><span class="lbl">${l.label}</span>${l.url?'<span>›</span>':'<span class="tag">em breve</span>'}`;
  nav.appendChild(el);
});
if(FOTO){document.getElementById('avatar').innerHTML=`<img src="${FOTO}" alt="Rebeca">`}
document.getElementById('y').textContent=new Date().getFullYear();
</script>
</body>
</html>
